name: Cypress Regression

on:
  pull_request:

jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Run Cypress E2E
        uses: cypress-io/github-action@v7
        with:
          browser: chrome
          build: npm run build
          start: npm run preview
          wait-on: http://127.0.0.1:4173